<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Maps Embed</title>
</head>
<body>
  <h1>Campus Location</h1>
  <!--
    1. Create a key in Google Cloud Console and enable the "Maps Embed API".
    2. Restrict the key to your website (HTTP referrer) and to this API only.
    3. Replace YOUR_API_KEY below.
  -->
  <iframe
    title="Map of North Nazimabad, Karachi"
    width="600" height="400" style="border:0" loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    src="https://www.google.com/maps/embed/v1/place?key=YOUR_API_KEY&q=North+Nazimabad,Karachi">
  </iframe>
</body>
</html>
