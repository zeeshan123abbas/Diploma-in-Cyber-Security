<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Entities and Attributes</title>
</head>
<body>
  <!-- entities print reserved characters as plain text -->
  <p>To write a tag as text use &lt;script&gt; instead of the real thing.</p>
  <p title="Tooltip text">Hover over me.</p>   <!-- title attribute -->
  <p>Fish &amp; Chips &copy; 2026</p>
  <!-- required is a boolean attribute -->
  <input type="text" placeholder="Your name" required>
</body>
</html>
