<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio and Video</title>
</head>
<body>
  <h1>Lab Introduction Video</h1>
  <!-- add your own intro.mp4 (and optionally intro.webm, poster.jpg) in this folder -->
  <video controls width="640" poster="poster.jpg" preload="metadata">
    <source src="intro.webm" type="video/webm">
    <source src="intro.mp4" type="video/mp4">
    <track kind="captions" src="intro.vtt" srclang="en" label="English" default>
    Your browser cannot play this video. <a href="intro.mp4">Download it</a>.
  </video>

  <h2>Alert sound</h2>
  <audio controls>
    <source src="alert.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>
</body>
</html>
