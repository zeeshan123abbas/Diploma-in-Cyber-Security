<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Timetable</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #666; padding: 8px; text-align: center; }
    .lab { background: #d6eaf8; }
  </style>
</head>
<body>
  <table>
    <caption>Weekly Timetable</caption>
    <colgroup>
      <col style="width: 120px">        <!-- time column -->
      <col span="3" style="width: 160px">
    </colgroup>
    <tr><th>Time</th><th>Monday</th><th>Wednesday</th><th>Friday</th></tr>
    <tr>
      <th>4:00 - 5:00</th>
      <td rowspan="2" class="lab">C Practical (2 h)</td>   <!-- spans 2 rows -->
      <td>Networks</td>
      <td>HTML5</td>
    </tr>
    <tr>
      <th>5:00 - 6:00</th>
      <!-- Monday cell is covered by the rowspan above -->
      <td>Networks</td>
      <td>HTML5</td>
    </tr>
  </table>
</body>
</html>
