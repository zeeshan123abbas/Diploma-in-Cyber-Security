<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberSafe Karachi - Report</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header>
    <h1>CyberSafe Karachi</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="report.html" class="active">Report</a>
      <a href="stats.html">Stats</a>
    </nav>
  </header>
  <main class="narrow">
    <h2>Report an incident</h2>
    <form action="#" method="post">
      <label>Name <input type="text" name="name" required></label>
      <label>Email <input type="email" name="email" required></label>
      <!-- Pakistani mobile format: 03XX-XXXXXXX -->
      <label>Phone <input type="tel" name="phone" pattern="03[0-9]{2}-[0-9]{7}" placeholder="0300-1234567"></label>
      <label>Incident type
        <select name="type" required>
          <option value="">-- choose --</option>
          <option>Phishing</option>
          <option>Account hacked</option>
          <option>Online fraud</option>
        </select>
      </label>
      <label>Date <input type="date" name="date"></label>
      <label>Description <textarea name="desc" rows="4" minlength="20" required></textarea></label>
      <label><input type="checkbox" name="consent" required> I confirm this information is true</label>
      <button type="submit">Submit report</button>
    </form>
  </main>
  <footer>&copy; 2026 CyberSafe Karachi (student project)</footer>
</body>
</html>
